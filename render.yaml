# Standalone browser game. Static hosting; no running Node server or database.
services:
  - type: web
    name: badzone-run
    runtime: static
    buildCommand: npm test && npm run build
    staticPublishPath: public
    autoDeployTrigger: commit
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Cache-Control
        value: no-cache
