# Existing static URL plus a single authoritative multiplayer API.
services:
  - type: web
    name: badzone-run
    runtime: static
    buildCommand: npm test && npm run build
    staticPublishPath: public
    autoDeployTrigger: commit
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Cache-Control
        value: no-cache
  - type: web
    name: badzone-run-api
    branch: multiplayer-live
    runtime: node
    plan: free
    buildCommand: npm test && npm run build
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: ALLOWED_ORIGINS
        value: https://badzone-run.onrender.com
